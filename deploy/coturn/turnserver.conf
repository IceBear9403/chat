# =============================================================
# 阶段六：coturn TURN/STUN 服务配置（模板）
#
# 本文件是模板，${ECS_PUBLIC_IP} / ${DOMAIN} / ${TURN_USERNAME} / ${TURN_PASSWORD}
# 由 deploy.sh 用 python3 从 .env 渲染成 generated/turnserver.conf 后挂载到容器。
# 直接改这里不会生效——请改 .env，或手动生成 generated 文件。
#
# 容器用 host 网络运行（见 docker-compose.yml），必须声明 external-ip，
# 否则阿里云 NAT 后 relay 地址不可达。
# =============================================================

# ---------- 监听与中继地址 ----------
# 容器内网卡，host 网络下即为 ECS 内网 IP
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# 必须：ECS 公网 IP（阿里云 NAT 之后必须声明，否则 relay 地址不可达）
external-ip=${ECS_PUBLIC_IP}

# ---------- 端口 ----------
listening-port=3478
# TURN 备用/HTTP 升级端口（可选，阿里云安全组未放行则注释掉）
# tls-listening-port=5349

# ---------- 认证（阶段六静态凭据） ----------
realm=${DOMAIN}
# 静态用户名密码，与 .env 的 TURN_USERNAME/TURN_PASSWORD 一致
user=${TURN_USERNAME}:${TURN_PASSWORD}
# 仅允许认证用户使用 TURN 中继
lt-cred-mech

# ---------- 功能开关 ----------
fingerprint
# 只做 TURN 中继，不代理多播
no-multicast-peers
no-cli
# 日志
log-file=stdout
# 关闭不必要的 RTP 配置探测日志
no-tls
no-dtls
