# =============================================================
# 阶段六：生产部署编排（阿里云 Ubuntu 22.04）
#
#   用法：cd deploy && ./deploy.sh   （或 cp .env.example .env && docker compose up -d --build）
#   端口：80 / 443 由 nginx 暴露，其余服务仅内网互通
#   注意：coturn 3478 需要额外暴露到公网（安全组放行 UDP/TCP 3478）
# =============================================================

name: social

x-app-common: &app-common
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  mysql:
    <<: *app-common
    image: mysql:8.0
    container_name: social-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: social
      MYSQL_USER: ${MYSQL_USER:-social}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表（仅空数据卷时执行一次）
      - ../docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # 阶段五软删字段迁移（幂等，重复执行无副作用）
      - ../docs/sql/migration_phase5_conversation_delete.sql:/docker-entrypoint-initdb.d/02-phase5-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # 不暴露宿主端口，仅内网

  redis:
    <<: *app-common
    image: redis:7
    container_name: social-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请在 .env 配置 REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    <<: *app-common
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: social-app:latest
    container_name: social-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: social
      DB_USERNAME: ${MYSQL_USER:-social}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 配置 REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在 .env 配置 JWT_ACCESS_SECRET(>=32字符)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 配置 JWT_REFRESH_SECRET(>=32字符)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请在 .env 配置 CORS_ALLOWED_ORIGINS}
      # 阶段六先用 mock 验证码联调；阶段七接阿里云短信后置 false 并配 SMS_*
      VERIFY_CODE_MOCK: ${VERIFY_CODE_MOCK:-true}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      # TURN 静态凭据（coturn 配置见 ./coturn/turnserver.conf）；未填则前端退化为 STUN
      TURN_URL: ${TURN_URL:-stun:stun.l.google.com:19302}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:18081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  coturn:
    <<: *app-common
    image: coturn/coturn
    container_name: social-coturn
    command: -c /etc/turnserver.conf
    # host 网络：TURN 需绑定 ECS 公网网卡做 relay，且阿里云 NAT 后必须 external-ip
    network_mode: host
    volumes:
      # deploy.sh 渲染生成的最终配置（含外部 IP / 域名 / 凭据）
      - ./coturn/generated/turnserver.conf:/etc/turnserver.conf:ro

  nginx:
    <<: *app-common
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: social-nginx:latest
    container_name: social-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # deploy.sh 渲染生成的最终配置（替换 ${DOMAIN} 占位）
      - ./nginx/generated/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书：阿里云免费证书或 certbot 产物挂载进来（名为 ${DOMAIN}.crt / ${DOMAIN}.key）
      - ./ssl/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  app-uploads:
