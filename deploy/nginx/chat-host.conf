# =============================================================================
# 主机级 nginx 配置：社交圈部署在 /chat 子路径下
#
# 与 deploy/nginx/default.conf（docker 部署用）互不影响，按实际部署方式二选一。
#
# 用法：
#   sudo cp deploy/nginx/chat-host.conf /etc/nginx/conf.d/chat.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 若该域名下已有 server 块（多个项目共用同一域名、靠路径区分），
# 不要新建 server，直接把下面 6 个 location 段整体粘进已有 server 块即可。
# 配置刻意使用 location 级 root（而非 server 级 root / alias），
# 就是为了合并时不污染别人的 root，也避开 alias 与 try_files 搭配的已知坑。
#
# 依赖：
#   - 前端产物放在 /usr/share/nginx/chat（vite.config.ts 已设 base: '/chat/'）
#   - 后端 Spring Boot 监听 127.0.0.1:18081，未设 context-path
# =============================================================================

# WebSocket 升级头映射，必须位于 http 上下文。
# 若 /etc/nginx/nginx.conf 或别的 conf.d 里已有同名 map，删掉这一段。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;                 # ← 改成你的域名

    client_max_body_size 20m;      # 与后端 multipart 上限保持一致

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_vary on;

    # ---------- /chat → /chat/ ----------
    # 少尾斜杠会让相对路径解析到根目录，统一 301 过去
    location = /chat {
        return 301 /chat/;
    }

    # ---------- 前端 SPA ----------
    # root 写在 location 里：请求 /chat/x → /usr/share/nginx/chat/x，URI 与磁盘路径一一对应
    location /chat/ {
        root /usr/share/nginx;
        index index.html;
        # 命中不到的真实文件（前端路由路径）回落到 index.html，交给 vue-router 处理
        try_files $uri $uri/ /chat/index.html;
    }

    # index.html 不缓存：发版后用户刷新即拿到新的 hash 文件名
    location = /chat/index.html {
        root /usr/share/nginx;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 构建产物文件名带内容哈希，可长期缓存
    location /chat/assets/ {
        root /usr/share/nginx;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- 后端 REST ----------
    # proxy_pass 带 URI（/api/）会把 location 匹配到的 /chat/api/ 替换成 /api/，
    # 后端因此完全感知不到 /chat 前缀。
    location /chat/api/ {
        proxy_pass http://127.0.0.1:18081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 上传文件 ----------
    # 后端 LocalStorageService 把文件落在 app.storage.local-path，由 WebConfig 的
    # /uploads/** 静态映射对外提供；这里同样剥掉 /chat 前缀。
    location /chat/uploads/ {
        proxy_pass http://127.0.0.1:18081/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- WebSocket（STOMP over 原生 ws）----------
    # 必须用精确匹配 =，否则前缀匹配会连 /chat/ws-sockjs 一起吃掉
    location = /chat/ws {
        proxy_pass http://127.0.0.1:18081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;      # 长连接，别让 60s 默认值把心跳掐了
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- SockJS 兜底（WebSocket 被中间设备拦截时轮询降级）----------
    location /chat/ws-sockjs {
        proxy_pass http://127.0.0.1:18081/ws-sockjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# =============================================================================
# HTTPS（必需）
#
# 音视频通话走 getUserMedia / RTCPeerConnection，浏览器只在安全上下文
# （HTTPS 或 localhost）下放行，纯 HTTP 访问只能收发文字消息。
#
# 如果该域名已经有 443 的 server 块，最省事的做法是把上面这 6 个 location
# 原样复制进去，只保留一个 server 块。
#
# 若本项目独占域名，则把上面的 server 块整体复制一份，改成：
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name 你的域名;
#
#     ssl_certificate     /etc/nginx/ssl/你的域名.crt;
#     ssl_certificate_key /etc/nginx/ssl/你的域名.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     # ... 其余 location / client_max_body_size / gzip 与 80 端口块完全一致 ...
# }
#
# 同时把 80 端口块改成只做跳转，避免明文访问：
#     server {
#         listen 80;
#         server_name 你的域名;
#         location /.well-known/acme-challenge/ { root /var/www/certbot; }
#         location / { return 301 https://$host$request_uri; }
#     }
# =============================================================================
