# =============================================================
# 阶段六：社交网站 Nginx 全量配置
#
#   - 全站 HTTPS：80 全量 301 → 443
#   - 前端静态托管（gzip / 强缓存，index.html 不缓存）
#   - /api/**、/uploads/** 反代到后端容器 social-app:18081
#   - /ws、/ws-sockjs WebSocket 升级（WSS 关键，缺 upgrade 头 H5 连不上信令）
#   - 证书目录：/etc/nginx/certs/{DOMAIN}.crt / .key（compose 挂载）
#   - 域名由 env 替换：sed 或用 envsubst；此处用变量 ${DOMAIN} 由 entrypoint 替换
# =============================================================

# 日志轮转由 docker json-file 驱动，此处不再单独切分
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # ACME challenge（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 80 请求全量跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # ---------------- SSL 证书 ----------------
    # 阿里云免费证书：fullchain 与 key 放在 ./ssl/certs/ 下，命名为 ${DOMAIN}.crt / ${DOMAIN}.key
    # 或 certbot 产物软链/拷贝到同名位置
    ssl_certificate     /etc/nginx/certs/${DOMAIN}.crt;
    ssl_certificate_key /etc/nginx/certs/${DOMAIN}.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------------- 上传大小限制（图片/视频） ----------------
    client_max_body_size 20m;

    # ---------------- gzip ----------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml application/wasm;
    gzip_vary on;

    # ---------------- 前端静态文件 ----------------
    # index.html 不缓存（保证发版即时生效）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass http://app:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------- 本地文件存储（LocalStorageService 返回 /uploads/**） ----------------
    location /uploads/ {
        proxy_pass http://app:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 图片等静态资源走长缓存
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }

    # ---------------- WebSocket 信令 ----------------
    # 原生 WebSocket：前端连 /ws?token=xxx
    location /ws {
        proxy_pass http://app:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SockJS 兜底：/ws-sockjs/info 及轮询请求（HTTP），带 upgrade 以支持原生 WS 传输
    location /ws-sockjs {
        proxy_pass http://app:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
