# 生产环境（阿里云 docker-compose 部署，阶段六启用）。
# 所有敏感配置通过环境变量注入，本文件不落明文密钥。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:social}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池最小可用连接（druid 未引入，使用 HikariCP 默认，可后续调优）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  mail:
    # 邮箱验证码 SMTP 发信（AUTH_MODE=email 时使用）。授权码经环境变量注入，不落明文
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: "*"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  # 生产关闭接口文档
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain.com}
  auth:
    # 认证模式：phone=手机验证，email=邮箱验证（改环境变量 AUTH_MODE 切换）
    mode: ${AUTH_MODE:phone}
  verify-code:
    # 接入阿里云短信后置为 false 并配置签名/模板
    mock-enabled: ${VERIFY_CODE_MOCK:false}
    sms-sign-name: ${SMS_SIGN_NAME:}
    sms-template-code: ${SMS_TEMPLATE_CODE:}
  mail:
    # 邮箱验证码真实发信开关（AUTH_MODE=email 且配置好 MAIL_* 后置 true）
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  nickname:
    # 昵称修改间隔（天，0=不限制）；管理员修改任意用户昵称不受此限制
    change-interval-days: ${NICKNAME_CHANGE_INTERVAL_DAYS:7}
  pii:
    # PII 加密密钥（>=16 字符），必须经环境变量注入，不得落明文
    key: ${APP_PII_KEY:}
  realname:
    # mock：接入阿里云实人认证前先用 mock 通过
    mock-enabled: ${REALNAME_MOCK:true}
  compliance:
    # 单实例部署默认开启；多实例扩展时对主实例保留 true，其余置 false
    job-enabled: ${COMPLIANCE_JOB_ENABLED:true}
  webrtc:
    # 生产 ICE：公共 STUN + 自建 coturn TURN（阶段六静态凭据，经 env 注入）。
    # TURN_URL 留空时第三个条目退化为 STUN 兜底（前端会过滤空 urls）。
    ice-servers:
      - urls: "stun:stun.l.google.com:19302"
      - urls: "stun:stun1.l.google.com:19302"
      - urls: "${TURN_URL:stun:stun.l.google.com:19302}"
        username: "${TURN_USERNAME:}"
        credential: "${TURN_PASSWORD:}"

logging:
  level:
    com.social: info
  # 日志只走 stdout，由 docker json-file 驱动轮转（50m×5）；
  # 不再配置 file.name —— 容器内文件无卷挂载会无限增长且 docker logs 看不到。
